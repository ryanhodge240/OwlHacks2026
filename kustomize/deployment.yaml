apiVersion: apps/v1
kind: Deployment
metadata:
  name: owlhacks2026
spec:
  replicas: 1
  selector:
    matchLabels:
      app: owlhacks2026
  template:
    metadata:
      labels:
        app: owlhacks2026
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: owlhacks2026
          image: ghcr.io/ryanhodge240/owlhacks2026:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 250m
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
