name: Build and Push Image

on:
    push:
        branches:
            - main
        paths:
            - 'src/**'
            - 'server/**'
            - 'public/**'
            - 'package.json'
            - 'package-lock.json'
            - 'tsconfig.json'
            - 'Dockerfile'
            - 'AGENTS.md'
            - '.prettierignore'
            - '.prettierrc.json'
            - '.github/workflows/docker-build.yml'
    pull_request:
        paths:
            - 'src/**'
            - 'server/**'
            - 'public/**'
            - '*.json'
            - '*.md'
            - '*.yml'
            - '*.yaml'
            - 'Dockerfile'
            - 'AGENTS.md'
            - '.prettierignore'
            - '.prettierrc.json'
            - '.github/workflows/docker-build.yml'

jobs:
    quality:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Run lint
              run: npm run lint

            - name: Run tests
              run: npm test -- --watchAll=false

            - name: Build application
              run: npm run build

    build:
        if: github.event_name == 'push'
        needs: quality
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/ryanhodge240/owlhacks2026:latest
                      ghcr.io/ryanhodge240/owlhacks2026:${{ github.sha }}
